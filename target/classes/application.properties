# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chitchat}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.http2.enabled=true

# JWT Configuration (REQUIRED for production)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=${JWT_EXPIRATION_MS:86400000}

# External Authentication (Optional)
app.externalAuth.enabled=${EXTERNAL_AUTH_ENABLED:false}
app.externalAuth.verifySignature=${EXTERNAL_AUTH_VERIFY_SIGNATURE:true}
app.externalAuth.jwtSecret=${EXTERNAL_AUTH_JWT_SECRET:}
app.externalAuth.usernameClaim=${EXTERNAL_AUTH_USERNAME_CLAIM:preferred_username}
app.externalAuth.userIdClaim=${EXTERNAL_AUTH_USER_ID_CLAIM:sub}
app.externalAuth.autoProvisionUser=${EXTERNAL_AUTH_AUTO_PROVISION_USER:false}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.learnerview.chitchat=${LOG_LEVEL_CHITCHAT:INFO}