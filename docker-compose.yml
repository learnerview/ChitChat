version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  chitchat:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo:27017/chitchat
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:*}
    ports: ["8080:8080"]
    depends_on: [mongo]
volumes:
  mongo_data:

