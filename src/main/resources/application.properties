spring.data.mongodb.uri=mongodb://localhost:27017/chitchat
spring.data.mongodb.auto-index-creation=true
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.http2.enabled=true

app.jwtSecret=d3f8a4c2e6b10d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e
app.jwtExpirationInMs=86400000

app.externalAuth.enabled=false
app.externalAuth.verifySignature=true
app.externalAuth.jwtSecret=
app.externalAuth.usernameClaim=preferred_username
app.externalAuth.userIdClaim=sub
app.externalAuth.autoProvisionUser=false

logging.level.root=INFO
logging.level.com.learnerview.chitchat=DEBUG