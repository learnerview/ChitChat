spring.data.mongodb.uri=mongodb://localhost:27017/chitchatdb
spring.data.mongodb.auto-index-creation=true

server.port=8080
server.servlet.session.timeout=15m

# JWT Configuration
app.jwtSecret=mySuperSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongAndSecureEnoughForHMACSHA512Algorithm
app.jwtExpirationInMs=86400000

# Thymeleaf dev mode
spring.thymeleaf.cache=false

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Upload Configuration
app.upload.dir=uploads
app.upload.base-url=http://localhost:8080/api/files

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.learnerview.chitchat=DEBUG
logging.file.name=logs/app.log
logging.file.max-size=10MB
logging.file.max-history=10

# Security
server.ssl.enabled=false

# WebSocket
spring.websocket.message-broker.relay.enabled=false

# Error Handling - Disable Whitelabel
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.export.simple.enabled=true