# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chitchat}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.http2.enabled=true

# JWT Configuration (REQUIRED for production)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=${JWT_EXPIRATION_MS:86400000}

# WebSocket allowed origin patterns (REST is same-origin via the dev proxy).
# Set explicitly in production, e.g. ALLOWED_ORIGINS=https://app.example.com
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Content limits
app.limits.max-message-length=${MAX_MESSAGE_LENGTH:5000}
app.limits.max-group-members=${MAX_GROUP_MEMBERS:500}

# Realtime limits
app.realtime.max-connections-per-user=${REALTIME_MAX_CONNECTIONS_PER_USER:5}
app.realtime.max-subscriptions-per-session=${REALTIME_MAX_SUBSCRIPTIONS_PER_SESSION:100}
app.realtime.max-send-payload-bytes=${REALTIME_MAX_SEND_PAYLOAD_BYTES:65536}
app.realtime.sync-batch-limit=${REALTIME_SYNC_BATCH_LIMIT:200}

# External Authentication (Optional)
app.externalAuth.enabled=${EXTERNAL_AUTH_ENABLED:false}
app.externalAuth.verifySignature=${EXTERNAL_AUTH_VERIFY_SIGNATURE:true}
app.externalAuth.jwtSecret=${EXTERNAL_AUTH_JWT_SECRET:}
app.externalAuth.usernameClaim=${EXTERNAL_AUTH_USERNAME_CLAIM:preferred_username}
app.externalAuth.userIdClaim=${EXTERNAL_AUTH_USER_ID_CLAIM:sub}
app.externalAuth.autoProvisionUser=${EXTERNAL_AUTH_AUTO_PROVISION_USER:false}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.learnerview.chitchat=${LOG_LEVEL_CHITCHAT:INFO}

# Webhook delivery worker (outbox)
app.webhook.poll-interval-ms=${WEBHOOK_POLL_INTERVAL_MS:5000}
app.webhook.poll-initial-delay-ms=${WEBHOOK_POLL_INITIAL_DELAY_MS:10000}
app.webhook.max-attempts=${WEBHOOK_MAX_ATTEMPTS:8}
app.webhook.batch-size=${WEBHOOK_BATCH_SIZE:50}
app.webhook.lease-seconds=${WEBHOOK_LEASE_SECONDS:300}
app.ws.ticket-ttl-seconds=${WS_TICKET_TTL_SECONDS:60}
